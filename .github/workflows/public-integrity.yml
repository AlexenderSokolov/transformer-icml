name: Public export integrity
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify exact public inventory
        run: python3 tools/public_verify.py
      - name: Test integrity rejection cases
        run: python3 -m unittest discover -s tests -v
